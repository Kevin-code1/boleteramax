<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoletaMax · Tus Boletos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#0b1627" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="apple-touch-icon" href="assets/favicon.svg" />
    <link rel="manifest" href="assets/site.webmanifest" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base-polish.css" />
    <style>
        :root {
            --bg: #071018;
            --panel: #0d1724;
            --panel-2: #101d2d;
            --text: #e8eef8;
            --muted: #96a5bb;
            --line: rgba(255, 255, 255, 0.08);
            --gold: #d4af37;
            --gold-soft: rgba(212, 175, 55, 0.14);
            --blue-soft: rgba(84, 110, 148, 0.18);
            --success: #25c46b;
            --danger: #ef5d63;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Manrope', sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top, rgba(84, 110, 148, 0.12), transparent 26%),
                linear-gradient(180deg, #09111a 0%, #050b12 100%);
        }

        a { color: inherit; text-decoration: none; }

        .page {
            max-width: 1240px;
            margin: 0 auto;
            padding: 42px 24px 56px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            letter-spacing: 0.02em;
        }

        .brand strong { color: var(--gold); }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 18px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            font-weight: 700;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
            transition: transform .22s ease, background .22s ease, border-color .22s ease, box-shadow .22s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(212, 175, 55, 0.26);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.22);
        }

        .btn.primary {
            background: linear-gradient(135deg, #c79e2d 0%, #ecd27a 100%);
            color: #08111f;
            border-color: rgba(236, 210, 122, 0.4);
            box-shadow: 0 14px 30px rgba(212, 175, 55, 0.2);
        }

        .btn.primary:hover {
            background: linear-gradient(135deg, #d4af37 0%, #f0dc9e 100%);
        }

        .hero {
            background: linear-gradient(180deg, rgba(16, 29, 45, 0.96), rgba(11, 19, 30, 0.92));
            border: 1px solid rgba(84, 110, 148, 0.18);
            border-radius: 30px;
            padding: 28px;
            box-shadow: 0 28px 60px rgba(0, 0, 0, 0.28);
            margin-bottom: 28px;
        }

        .eyebrow {
            color: var(--gold);
            letter-spacing: .18em;
            text-transform: uppercase;
            font-size: .72rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .hero h1 {
            margin: 0 0 12px;
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.3rem, 5vw, 3.8rem);
            line-height: .96;
            font-weight: 700;
        }

        .hero p {
            margin: 0;
            max-width: 760px;
            color: var(--muted);
            line-height: 1.7;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            margin-top: 24px;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 16px 18px;
        }

        .summary-card span {
            display: block;
            color: var(--muted);
            font-size: .72rem;
            text-transform: uppercase;
            letter-spacing: .12em;
            margin-bottom: 6px;
        }

        .summary-card strong {
            display: block;
            font-size: 1rem;
            color: var(--text);
        }

        .state,
        .empty {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 24px;
            color: var(--muted);
        }

        .tickets-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 26px;
        }

        .ticket-card {
            background: linear-gradient(180deg, rgba(15, 26, 40, 0.96), rgba(11, 19, 30, 0.94));
            border: 1px solid rgba(84, 110, 148, 0.18);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 30px 64px rgba(0, 0, 0, 0.34);
            position: relative;
            transition: transform .24s ease, box-shadow .24s ease, border-color .24s ease;
        }

        .ticket-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 36px 76px rgba(0, 0, 0, 0.4);
            border-color: rgba(212, 175, 55, 0.18);
        }

        .ticket-card::after {
            content: '';
            position: absolute;
            top: 78px;
            bottom: 24px;
            right: min(360px, 35%);
            border-left: 1px dashed rgba(212, 175, 55, 0.24);
            pointer-events: none;
        }

        .ticket-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 18px 20px;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.02);
        }

        .ticket-head strong {
            font-size: .94rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--gold);
        }

        .status-pill {
            padding: 8px 12px;
            border-radius: 999px;
            font-size: .72rem;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
            border: 1px solid transparent;
            backdrop-filter: blur(8px);
        }

        .status-pill.active {
            color: #f3d983;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.08), rgba(212, 175, 55, 0.02));
            border-color: rgba(212, 175, 55, 0.24);
        }

        .status-pill.used {
            color: #7de0a6;
            background: rgba(37, 196, 107, 0.12);
            border-color: rgba(37, 196, 107, 0.2);
        }

        .status-pill.cancelled {
            color: #ff9ea3;
            background: rgba(239, 93, 99, 0.12);
            border-color: rgba(239, 93, 99, 0.2);
        }

        .ticket-body {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(280px, 340px);
            gap: 28px;
            padding: 26px;
            align-items: stretch;
        }

        .ticket-info h2 {
            margin: 0 0 12px;
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2rem, 4vw, 3.25rem);
            line-height: .92;
            max-width: 620px;
        }

        .meta-list {
            display: grid;
            gap: 12px;
            margin: 0 0 18px;
        }

        .meta-row {
            display: grid;
            gap: 4px;
        }

        .meta-row span {
            color: var(--muted);
            font-size: .72rem;
            text-transform: uppercase;
            letter-spacing: .12em;
        }

        .meta-row strong {
            color: var(--text);
            font-size: .95rem;
            line-height: 1.55;
        }

        .ticket-meta-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .ticket-meta-card {
            border-radius: 18px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.03);
            padding: 14px;
        }

        .ticket-meta-card span {
            display: block;
            color: var(--muted);
            font-size: .68rem;
            text-transform: uppercase;
            letter-spacing: .12em;
            margin-bottom: 6px;
        }

        .ticket-meta-card strong {
            color: var(--text);
            word-break: break-word;
        }

        .ticket-code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            font-size: .92rem;
            letter-spacing: .04em;
        }

        .ticket-meta-card.price-card strong {
            color: #f2d57a;
            font-size: 1.34rem;
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: .01em;
        }

        .qr-panel {
            border-radius: 22px;
            border: 1px solid rgba(212, 175, 55, 0.16);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            min-height: 100%;
            transition: transform .24s ease, border-color .24s ease, box-shadow .24s ease, background .24s ease;
        }

        .qr-panel:hover {
            transform: translateY(-3px);
            border-color: rgba(212, 175, 55, 0.24);
            box-shadow: 0 20px 46px rgba(0, 0, 0, 0.22);
        }

        .qr-panel.is-warning {
            border-color: rgba(212, 175, 55, 0.34);
            box-shadow: 0 18px 40px rgba(212, 175, 55, 0.08);
        }

        .qr-panel.is-blocked {
            border-color: rgba(255, 255, 255, 0.08);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.015));
        }

        .qr-status-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .qr-box {
            position: relative;
            width: min(100%, 250px);
            background: #ffffff;
            border-radius: 22px;
            padding: 16px;
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.18);
            overflow: hidden;
            transition: transform .24s ease, box-shadow .24s ease, filter .24s ease;
        }

        .qr-panel:hover .qr-box {
            transform: translateY(-2px);
            box-shadow: 0 24px 42px rgba(0, 0, 0, 0.22);
        }

        .qr-box.is-blocked {
            background: linear-gradient(180deg, #eef1f7, #d7dde8);
        }

        .qr-box.is-blocked img {
            opacity: 0.14;
            filter: grayscale(1) blur(1px);
        }

        .qr-box img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 14px;
        }

        .qr-loading {
            position: absolute;
            inset: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border-radius: 14px;
            background: linear-gradient(180deg, rgba(244, 247, 252, 0.98), rgba(233, 238, 247, 0.96));
            color: #0b1220;
            text-align: center;
            padding: 22px 18px;
        }

        .qr-loading[hidden] {
            display: none;
        }

        .qr-skeleton {
            width: min(100%, 190px);
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            background:
                linear-gradient(90deg, rgba(11, 18, 32, 0.08) 25%, rgba(11, 18, 32, 0.16) 50%, rgba(11, 18, 32, 0.08) 75%);
            background-size: 220% 100%;
            animation: qrPulse 1.35s ease-in-out infinite;
            box-shadow: inset 0 0 0 1px rgba(11, 18, 32, 0.06);
        }

        .qr-loading-text {
            font-size: .84rem;
            font-weight: 700;
            letter-spacing: .01em;
            color: rgba(11, 18, 32, 0.8);
        }

        .qr-blocked {
            position: absolute;
            inset: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 14px;
            background: linear-gradient(180deg, rgba(11, 18, 32, 0.82), rgba(11, 18, 32, 0.9));
            color: #ffffff;
            text-align: center;
            padding: 20px;
            backdrop-filter: blur(8px);
        }

        .qr-blocked[hidden] {
            display: none;
        }

        .qr-blocked-label {
            font-size: .72rem;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.74);
        }

        .qr-blocked-status {
            font-size: 1.02rem;
            font-weight: 800;
            letter-spacing: .01em;
        }

        .qr-timer-track {
            width: 100%;
            height: 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.06);
        }

        .qr-timer-fill {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.9), rgba(248, 223, 142, 0.98));
            box-shadow: 0 0 14px rgba(212, 175, 55, 0.22);
            transform-origin: left center;
            transition: transform .7s linear, background .2s ease, box-shadow .2s ease;
        }

        .qr-note {
            text-align: center;
            color: var(--muted);
            font-size: .8rem;
            line-height: 1.6;
        }

        .qr-note strong {
            display: block;
            margin-bottom: 6px;
            color: var(--text);
            font-size: .9rem;
            font-weight: 800;
        }

        .qr-dynamic-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.18);
            color: #f0d47d;
            font-size: .72rem;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .qr-dynamic-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d4af37;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.52);
        }

        .qr-refresh {
            min-width: 142px;
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid rgba(212, 175, 55, 0.12);
            background: rgba(255, 255, 255, 0.04);
            font-size: .82rem;
            color: var(--text);
            font-weight: 700;
            transition: border-color .2s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
        }

        .qr-refresh-label {
            font-size: .68rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.65);
        }

        .qr-refresh strong {
            color: var(--gold);
            font-size: 1rem;
            letter-spacing: .02em;
        }

        .qr-refresh.is-warning {
            background: rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.3);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.08);
        }

        .qr-refresh.is-warning .qr-refresh-label {
            color: rgba(248, 223, 142, 0.9);
        }

        .qr-refresh.is-warning strong {
            color: #ffe59c;
        }

        .qr-error {
            color: #ffb0b4;
            font-size: .82rem;
            text-align: center;
            line-height: 1.6;
        }

        @keyframes qrPulse {
            0% {
                background-position: 100% 50%;
            }
            100% {
                background-position: -100% 50%;
            }
        }

        .ticket-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .ticket-actions .btn {
            flex: 1 1 190px;
        }

        @media (max-width: 1040px) {
            .ticket-card::after {
                display: none;
            }

            .ticket-body {
                grid-template-columns: 1fr;
            }

            .ticket-meta-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .qr-panel {
                min-height: auto;
            }
        }

        @media (max-width: 860px) {
            .summary {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 560px) {
            .page {
                padding: 28px 16px 42px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .ticket-meta-grid {
                grid-template-columns: 1fr;
            }

            .qr-status-row {
                align-items: stretch;
            }

            .qr-refresh {
                width: 100%;
            }
        }

        /* Enterprise ticket polish: visual-only layer, QR logic untouched. */
        body {
            background:
                radial-gradient(circle at 12% 0%, rgba(212, 175, 55, 0.12), transparent 24%),
                radial-gradient(circle at 86% 8%, rgba(51, 103, 175, 0.16), transparent 28%),
                linear-gradient(180deg, #050B12 0%, #071018 52%, #05080d 100%);
        }

        .topbar {
            position: sticky;
            top: 16px;
            z-index: 20;
            padding: 12px;
            border-radius: 999px;
            background: rgba(7, 16, 24, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
        }

        .brand {
            color: #fff7eb;
            letter-spacing: .01em;
        }

        .brand strong,
        .eyebrow,
        .ticket-code,
        .price-card strong {
            color: #ECD27A;
        }

        .btn,
        .copy-qr-btn {
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(16, 29, 45, 0.78);
            color: #E8EEF8;
            transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease, background .22s ease;
        }

        .btn:hover,
        .copy-qr-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: rgba(212, 175, 55, 0.28);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
        }

        .btn.primary {
            color: #071018;
            background: linear-gradient(135deg, #ECD27A, #D4AF37 52%, #B98523);
            border-color: rgba(236, 210, 122, 0.48);
        }

        .hero {
            border: 1px solid rgba(255, 255, 255, 0.08);
            background:
                radial-gradient(circle at top left, rgba(212, 175, 55, 0.11), transparent 28%),
                linear-gradient(180deg, rgba(16, 29, 45, 0.92), rgba(8, 15, 25, 0.92));
            box-shadow: 0 28px 70px rgba(0, 0, 0, 0.32);
        }

        .hero h1,
        .ticket-info h2 {
            color: #fff7eb;
            text-shadow: 0 20px 50px rgba(0, 0, 0, 0.34);
        }

        .hero p,
        .meta-row span,
        .ticket-meta-card span,
        .qr-note,
        .state {
            color: #96A5BB;
        }

        .ticket-card {
            background:
                radial-gradient(circle at top left, rgba(212, 175, 55, 0.1), transparent 28%),
                linear-gradient(180deg, rgba(16, 29, 45, 0.98), rgba(7, 16, 24, 0.98));
            border-color: rgba(255, 255, 255, 0.09);
            box-shadow: 0 30px 78px rgba(0, 0, 0, 0.38);
        }

        .ticket-head {
            background: rgba(5, 11, 18, 0.42);
            border-bottom: 1px dashed rgba(212, 175, 55, 0.22);
        }

        .ticket-meta-card,
        .meta-row {
            background: rgba(5, 11, 18, 0.36);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .status-pill.active {
            color: #ECD27A;
            background: rgba(212, 175, 55, 0.1);
            border-color: rgba(212, 175, 55, 0.28);
        }

        .status-pill.used {
            color: #FDBA74;
            background: rgba(245, 158, 11, 0.12);
            border-color: rgba(245, 158, 11, 0.28);
        }

        .qr-panel {
            background:
                linear-gradient(180deg, rgba(16, 29, 45, 0.95), rgba(7, 16, 24, 0.95));
            border-color: rgba(212, 175, 55, 0.18);
        }

        .qr-box {
            margin-inline: auto;
            box-shadow: 0 24px 54px rgba(0, 0, 0, 0.28);
        }

        .qr-dynamic-badge,
        .qr-refresh {
            background: rgba(212, 175, 55, 0.08);
            border-color: rgba(212, 175, 55, 0.22);
        }

        /* Editorial ticket pass: one premium ticket card, fewer mini-cards inside it. */
        .topbar {
            box-shadow: none;
        }

        .hero {
            border-color: rgba(255, 255, 255, 0.065);
            box-shadow: 0 22px 56px rgba(0, 0, 0, 0.24);
        }

        .ticket-card {
            box-shadow: 0 26px 68px rgba(0, 0, 0, 0.34);
        }

        .ticket-head {
            background: transparent;
        }

        .ticket-meta-grid {
            gap: 0 24px;
        }

        .ticket-meta-card,
        .meta-row {
            padding: 12px 0;
            border: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.065);
            border-radius: 0;
            background: transparent;
            box-shadow: none;
        }

        .ticket-meta-card:last-child,
        .meta-row:last-child {
            border-bottom-color: transparent;
        }

        .price-card {
            padding-block: 16px;
        }

        .qr-panel {
            background: transparent;
            border-color: rgba(212, 175, 55, 0.14);
            box-shadow: none;
        }

        .qr-box {
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.22);
        }

        .ticket-actions .btn,
        .copy-qr-btn {
            box-shadow: none;
        }

        .ticket-actions .btn:hover,
        .copy-qr-btn:hover:not(:disabled) {
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.22);
        }

        @media (max-width: 620px) {
            .topbar {
                align-items: stretch;
                border-radius: 24px;
                flex-direction: column;
            }

            .actions {
                display: grid;
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="topbar">
            <div class="brand">Boleta<strong>Max</strong></div>
            <div class="actions">
