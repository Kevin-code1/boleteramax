<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/favicon.svg" />
    <title>BoletaMax · Verificación de correo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #071018;
            --panel: #0f1826;
            --text: #edf2fb;
            --muted: #98a7bc;
            --gold: #d4af37;
            --success: #22c55e;
            --danger: #ef5d63;
            --line: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Manrope', sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top, rgba(212, 175, 55, 0.08), transparent 26%),
                radial-gradient(circle at bottom, rgba(84, 110, 148, 0.12), transparent 30%),
                linear-gradient(180deg, #08111a 0%, #040a11 100%);
        }

        .card {
            width: min(460px, 92vw);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 40px 34px;
            text-align: center;
            box-shadow: 0 28px 64px rgba(0, 0, 0, 0.4);
        }

        .brand {
            font-weight: 800;
            letter-spacing: 0.02em;
            color: var(--gold);
            margin-bottom: 20px;
        }

        .icon {
            font-size: 42px;
            line-height: 1;
            margin-bottom: 14px;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.9rem;
            margin: 0 0 10px;
        }

        p {
            color: var(--muted);
            margin: 0 0 22px;
            line-height: 1.55;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 999px;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid var(--line);
            color: var(--text);
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d4ab68 0%, #f0d39b 100%);
            color: #17191c;
            border-color: rgba(240, 211, 155, 0.55);
        }

        .state-success .icon { color: var(--success); }
        .state-error .icon,
        .state-expired .icon { color: var(--danger); }
        .state-loading .icon { color: var(--gold); }

        [hidden] { display: none !important; }

        .spinner {
            width: 34px;
            height: 34px;
            margin: 0 auto 14px;
            border: 3px solid rgba(212, 175, 55, 0.25);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <main class="card" id="card">
        <div class="brand">⚡ BoletaMax</div>

        <div class="spinner" id="spinner"></div>
        <div class="icon" id="icon" hidden></div>
        <h1 id="title">Verificando tu correo…</h1>
        <p id="message">Un momento, estamos confirmando tu enlace.</p>

        <div class="actions" id="actions" hidden>
            <a class="btn btn-primary" id="login-link" href="/#" hidden>Iniciar sesión</a>
            <a class="btn" href="/">Volver al inicio</a>
        </div>
    </main>

    <script src="/js/pages/verify-email.js"></script>
</body>
</html>
